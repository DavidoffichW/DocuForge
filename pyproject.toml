[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docuforge"
version = "0.2.0"
description = "Local-first PDF workspace for page operations, faithful merging, and table extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi",
  "openpyxl",
  "pdfplumber",
  "pikepdf",
  "pydantic",
  "pypdf",
  "python-multipart",
  "uvicorn",
]

[project.scripts]
docuforge = "docuforge.__main__:main"

[tool.setuptools.packages.find]
include = ["docuforge*"]

[tool.setuptools.package-data]
docuforge = ["editor/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "browser: exercises the integrated application in a real browser",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
